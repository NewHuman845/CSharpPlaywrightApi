name: Playwright API Automation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Restore dependencies
      - name: Restore dependencies
        run: dotnet restore

      # Build project
      - name: Build project
        run: dotnet build --configuration Release --no-restore

      # Run Playwright tests
      - name: Run Playwright tests
        run: dotnet test

      - name: List files
        run: ls -R
      
      # Upload Extent Report artifact
      - name: Upload Extent Report
        uses: actions/upload-artifact@v4
        with:
          name: ExtentReport
          path: CSharpPlaywrightApi/CSharpPlaywrightApi/CSharpPlaywrightApi/bin/Debug/net8.0/Reports/ExtentReport.html

      - name: Download Extent Report 
        uses: actions/download-artifact@v4 
        with: 
          name: ExtentReport 
          path: ./Reports
          
      # Send Email with PowerShell
      - name: Email report to stakeholders
        shell: pwsh
        run: |
          $reportPath = "./Reports/ExtentReport.html"
          $smtpServer = "smtp.gmail.com"
          $smtpPort = 587
          $username = "${{ secrets.SMTP_USERNAME }}"
          $password = "${{ secrets.SMTP_PASSWORD }}"
          $securePwd = ConvertTo-SecureString $password -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential($username, $securePwd)
      
          if (Test-Path $reportPath) {
            Send-MailMessage `
              -From "ci-pipeline@example.com" `
              -To "stakeholder1@example.com, stakeholder2@example.com" `
              -Subject "Playwright API Automation Report" `
              -Body "Hello Team,<br><br>Please find attached the latest Playwright API automation Extent Report.<br><br>Regards,<br>CI Pipeline" `
              -BodyAsHtml `
              -SmtpServer $smtpServer `
              -Port $smtpPort `
              -UseSsl `
              -Credential $cred `
              -Attachments $reportPath
          } else {
            Write-Error "Report file not found at $reportPath"
          }
